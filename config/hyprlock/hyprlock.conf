# ============================================================
# HYPRCADE // COWBOY BEBOP
# HYPRLOCK — SHIP SECURITY HUD
# ============================================================


general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}


# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =

    path = /home/emo/Programs/HyprCade/wallpapers/cowboy-bebop/main.png

    blur_passes = 0

    brightness = 0.48
    contrast = 1.04

    vibrancy = 0.10
    vibrancy_darkness = 0.0
}


