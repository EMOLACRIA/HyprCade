# ============================================================
# PASSWORD TERMINAL
# ============================================================

input-field {
    monitor =

    size = 560, 54

    position = 0, -125

    halign = center
    valign = center

    outline_thickness = 1
    rounding = 0

    outer_color = rgb(3977A8)
    inner_color = rgba(7, 10, 13, 0.92)

    font_color = rgb(E8E2D5)
    font_family = monospace

    dots_size = 0.17
    dots_spacing = 0.24
    dots_center = true
    dots_rounding = 0

    fade_on_empty = false

    placeholder_text = <span foreground="##71808D">ACCESS CODE // ENTER PASSWORD</span>

    check_color = rgb(3D8177)
    check_text = LINK ESTABLISHED // VERIFYING

    fail_color = rgb(D33A3A)
    fail_text = ACCESS DENIED // $FAIL

    capslock_color = rgb(D6A83C)
}


label {
    monitor =

    text = [ ENTER // RESTORE SESSION ]

    color = rgb(D33A3A)

    font_family = monospace
    font_size = 9

    position = 0, -174

